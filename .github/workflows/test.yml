name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Chart and pipeline dependencies
        run: python -m pip install fonttools==4.68.0 pandas==3.1.1 pyarrow==26.0.1
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every rule has a failing test without it
        run: python -m tests.ablate
      - name: Lint this repo's own agent files
        run: python -m agentfiles lint . --min-severity warning
