<rect class="box-accent" x="220" y="70" width="228.6" height="18" rx="2"/>
<text class="ts" x="456.6" y="84">38.3%</text>
<text class="t" x="0" y="114" style="font-size:13.5px">Mentions it in the text</text>
<rect class="box-accent" x="220" y="100" width="96.1" height="18" rx="2"/>
<text class="ts" x="324.1" y="114">16.1%</text>
