[project]
name = "agent-files-index"
version = "0.1.0"
description = "Lint AGENTS.md, CLAUDE.md and SKILL.md files, with rules drawn from the Agent Files Index dataset"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prasad Subrahmanya" }]
dependencies = []

[project.scripts]
agentfiles = "agentfiles.cli:main"

[dependency-groups]
data = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "fonttools>=4.68.0",
    "resvg-py==0.5.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentfiles"]

[tool.hatch.build.targets.sdist]
include = ["/agentfiles", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]
